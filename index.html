<!DOCTYPE html>
<html lang="fr">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<!-- =====================================================
     HORS CONNEXION
===================================================== -->

<link rel="manifest" href="manifest.json">

<meta name="theme-color" content="#ffd6e7">

<title>Le jeu d'Alicia</title>

<style>

/* =====================================================
   GENERAL
===================================================== */

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;

    font-family: Arial, sans-serif;
    text-align: center;
    color: #333;

    background:
        linear-gradient(
            135deg,
            #fff1c7,
            #ffd6e7,
            #d8c8ff,
            #b9e7ff,
            #c9f5d0
        );

    background-size: 300% 300%;

    animation:
        backgroundMove 15s ease infinite;
}

@keyframes backgroundMove {

    0% {
        background-position: 0% 50%;
    }

    50% {
        background-position: 100% 50%;
    }

    100% {
        background-position: 0% 50%;
    }
}

h1 {
    font-size: clamp(36px, 6vw, 60px);
    margin: 20px 10px;
}

h2 {
    font-size: clamp(28px, 5vw, 45px);
}

.screen {
    max-width: 1100px;
    margin: auto;
    padding: 20px;
}

.hidden {
    display: none !important;
}


/* =====================================================
   BOUTONS
===================================================== */

button {
    cursor: pointer;
    font-family: inherit;
}

.action-button {

    border: none;
    border-radius: 25px;

    padding: 18px 28px;
    margin: 10px;

    font-size: 25px;

    background: white;

    box-shadow:
        0 5px 15px rgba(0,0,0,.15);

    transition:
        transform .2s ease;
}

.action-button:hover {
    transform: scale(1.03);
}

.action-button:active {
    transform: scale(.97);
}

.back {
    background: #eeeeee;
}


/* =====================================================
   ACCUEIL
===================================================== */

#home {
    max-width: 1150px;

    padding-top: 45px;
}

.home-title {

    font-size:
        clamp(38px, 7vw, 65px);

    margin:
        15px 10px 45px;

    font-weight: bold;
}

.home-menu {

    display: grid;

    grid-template-columns:
        repeat(2, minmax(280px, 460px));

    justify-content: center;

    gap: 30px;

    /*
       Images descendues et légèrement plus grosses
    */

    margin:
        130px auto 50px;
}

.home-button {

    position: relative;

    border: none;

    padding: 0;
    margin: 0;

    width: 100%;

    aspect-ratio: 16 / 9;

    border-radius: 32px;

    overflow: hidden;

    background: transparent;

    box-shadow:
        0 7px 18px rgba(0,0,0,.18);

    transition:
        transform .25s ease,
        filter .25s ease;
}

.home-button img {

    display: block;

    width: 100%;
    height: 100%;

    object-fit: cover;

    border-radius: 32px;
}

.home-bubble {

    position: absolute;

    right: 12px;
    bottom: 12px;

    width: 65px;
    height: 65px;

    border-radius: 50%;

    background: rgba(255,255,255,.94);

    display: flex;

    align-items: center;
    justify-content: center;

    font-size: 34px;

    box-shadow:
        0 4px 12px rgba(0,0,0,.20);

    z-index: 2;

    pointer-events: none;
}

.home-button:hover {

    transform: scale(1.025);

    filter:
        drop-shadow(
            0 10px 18px
            rgba(0,0,0,.20)
        );
}

.home-button:active {
    transform: scale(.97);
}


/* =====================================================
   CHOIX DU MODE
===================================================== */

#category {
    max-width: 1150px;
}

#categoryImage {

    display: block;

    width: min(420px, 80vw);

    height: 180px;

    object-fit: contain;

    margin: 0 auto 10px;

    border-radius: 25px;
}

#categoryTitle {

    font-size:
        clamp(40px, 7vw, 60px);

    margin:
        15px 10px 35px;

    font-weight: bold;
}

.modes {

    display: grid;

    grid-template-columns:
        repeat(3, minmax(250px, 1fr));

    gap: 25px;

    max-width: 1050px;

    margin: 30px auto 35px;

    align-items: stretch;
}

.mode-button {

    position: relative;

    width: 100%;

    aspect-ratio: 4 / 3;

    padding: 0;

    border: none;

    border-radius: 30px;

    background: white;

    overflow: hidden;

    box-shadow:
        0 7px 18px rgba(0,0,0,.18);

    transition:
        transform .25s ease,
        box-shadow .25s ease;
}

.mode-button img {

    display: block;

    width: 100%;
    height: 100%;

    object-fit: contain;

    border-radius: 30px;
}

.mode-button:hover {

    transform: scale(1.035);

    box-shadow:
        0 10px 25px rgba(0,0,0,.23);
}

.mode-button:active {
    transform: scale(.97);
}

#category .back {

    margin-top: 5px;

    width: 75px;
    height: 65px;

    padding: 0;

    font-size: 32px;

    border-radius: 22px;
}


/* =====================================================
   ZONE DE JEU
===================================================== */

.game-area {

    background:
        rgba(255,255,255,.92);

    border-radius: 35px;

    padding: 30px;

    margin-top: 20px;

    box-shadow:
        0 5px 20px
        rgba(0,0,0,.08);
}


/* =====================================================
   MODE ALICIA
===================================================== */

.show-game-area {
    position: relative;
}

.mode-bubble,
.guess-mode-bubble,
.solo-mode-bubble {

    position: absolute;

    top: 15px;
    right: 15px;

    width: 150px;
    height: 150px;

    border-radius: 50%;

    background: white;

    padding: 6px;

    box-shadow:
        0 6px 18px rgba(0,0,0,.22);

    overflow: hidden;

    z-index: 10;
}

.mode-bubble img,
.guess-mode-bubble img,
.solo-mode-bubble img {

    width: 100%;
    height: 100%;

    object-fit: cover;

    border-radius: 50%;

    display: block;
}

.show-photo-box {

    width: min(700px, 90vw);

    height: min(520px, 60vh);

    margin: 20px auto 25px;

    border-radius: 30px;

    overflow: hidden;

    background: white;

    box-shadow:
        0 6px 20px rgba(0,0,0,.20);
}

.show-photo-box.animals {

    width: min(700px, 90vw);
    height: min(520px, 60vh);
}

.show-photo-box.disney {

    width: min(550px, 80vw);
    height: min(700px, 75vh);
}

.show-photo {

    width: 100%;
    height: 100%;

    object-fit: cover;

    display: block;
}

.show-navigation,
.guess-navigation,
.solo-navigation {

    display: flex;

    justify-content: center;
    align-items: center;

    gap: 20px;

    margin: 15px auto 20px;

    flex-wrap: wrap;
}

.next-button,
.guess-next-button,
.solo-next-button {

    background: #5dcc72;

    color: white;

    font-weight: bold;

    min-width: 190px;
}

.show-navigation .back,
.guess-navigation .back,
.solo-navigation .back {

    min-width: 190px;
}


/* =====================================================
   MODE PARENTS
===================================================== */

.guess-game-area {
    position: relative;
}

.guess-photo-box {

    width: min(700px, 90vw);

    height: min(520px, 60vh);

    margin: 20px auto 25px;

    border-radius: 30px;

    overflow: hidden;

    background: white;

    box-shadow:
        0 6px 20px rgba(0,0,0,.20);
}

.guess-photo-box.animals {

    width: min(700px, 90vw);
    height: min(520px, 60vh);
}

.guess-photo-box.disney {

    width: min(550px, 80vw);
    height: min(700px, 75vh);
}

.guess-photo {

    width: 100%;
    height: 100%;

    object-fit: cover;

    display: block;
}


/* =====================================================
   BOUTONS INDICES
===================================================== */

.guess-tools {

    display: flex;

    justify-content: center;
    align-items: stretch;

    gap: 20px;

    margin: 20px auto;

    flex-wrap: wrap;
}

.guess-tool-button {

    width: min(280px, 40vw);

    aspect-ratio: 16 / 9;

    padding: 0;

    border: none;

    border-radius: 25px;

    overflow: hidden;

    background: white;

    box-shadow:
        0 6px 15px rgba(0,0,0,.18);

    transition:
        transform .2s ease;
}

.guess-tool-button:hover {
    transform: scale(1.03);
}

.guess-tool-button:active {
    transform: scale(.97);
}

.guess-tool-button img {

    width: 100%;
    height: 100%;

    object-fit: cover;

    display: block;
}


/* =====================================================
   GALERIE
===================================================== */

.gallery {

    display: grid;

    grid-template-columns:
        repeat(4, 1fr);

    gap: 15px;

    max-width: 900px;

    margin: 30px auto;
}

.gallery button {

    padding: 5px;

    border:
        5px solid transparent;

    border-radius: 20px;

    background: white;

    overflow: hidden;

    transition:
        transform .2s ease,
        border-color .2s ease;
}

.gallery button:hover {

    border-color:
        #ffd166;

    transform:
        scale(1.03);
}

.gallery img {

    width: 100%;

    aspect-ratio: 1 / 1;

    object-fit: cover;

    border-radius: 15px;

    display: block;
}


/* =====================================================
   DISNEY = PORTRAIT
===================================================== */

#choices.disney-gallery,
#soloChoices.disney-gallery {

    grid-template-columns:
        repeat(4, 1fr);
}

#choices.disney-gallery button,
#soloChoices.disney-gallery button {

    aspect-ratio: 3 / 4;

    padding: 5px;
}

#choices.disney-gallery img,
#soloChoices.disney-gallery img {

    width: 100%;
    height: 100%;

    aspect-ratio: auto;

    object-fit: cover;

    border-radius: 15px;
}


/* =====================================================
   INDICES
===================================================== */

.hint-box {

    max-width: 600px;

    margin: 25px auto;

    padding:
        20px 15px 25px;

    border-radius: 30px;

    background:
        linear-gradient(
            145deg,
            #fffdf3,
            #fff3c7
        );

    box-shadow:
        0 7px 18px
        rgba(0,0,0,.12);

    animation:
        hintAppear .45s ease;
}

.hint-title {

    font-size: 38px;

    margin-bottom: 15px;
}

.hint-icons {

    display: flex;

    justify-content: center;

    align-items: center;

    gap: 8px;

    flex-wrap: nowrap;
}

.hint-card {

    width: 150px;
    height: 150px;

    display: flex;

    justify-content: center;
    align-items: center;

    background: white;

    border-radius: 25px;

    box-shadow:
        0 5px 12px
        rgba(0,0,0,.15);

    animation:
        cardPop .45s ease;

    flex: 1 1 0;

    max-width: 150px;

    min-width: 0;
}

.hint-image {

    width: 120px;
    height: 120px;

    object-fit: contain;

    display: block;
}

.hint-card:hover {

    transform:
        scale(1.08)
        rotate(2deg);
}

@keyframes hintAppear {

    from {

        opacity: 0;

        transform:
            translateY(20px)
            scale(.95);
    }

    to {

        opacity: 1;

        transform:
            translateY(0)
            scale(1);
    }
}

@keyframes cardPop {

    from {

        opacity: 0;

        transform:
            scale(.5);
    }

    to {

        opacity: 1;

        transform:
            scale(1);
    }
}


/* =====================================================
   SOLO
===================================================== */

.solo-game-area {
    position: relative;
}

.solo-audio-area {

    margin:
        25px auto 20px;

    display: flex;

    justify-content: center;
}

.solo-audio-button {

    width: 180px;
    height: 100px;

    border: none;

    border-radius: 30px;

    background: white;

    font-size: 55px;

    box-shadow:
        0 6px 18px rgba(0,0,0,.18);

    transition:
        transform .2s ease;
}

.solo-audio-button:hover {
    transform: scale(1.05);
}

.solo-audio-button:active {
    transform: scale(.96);
}

.solo-hint-button {

    border: none;

    border-radius: 25px;

    padding: 0;

    width: min(280px, 80vw);

    aspect-ratio: 16 / 9;

    overflow: hidden;

    background: white;

    box-shadow:
        0 6px 15px rgba(0,0,0,.18);

    transition:
        transform .2s ease;
}

.solo-hint-button:hover {
    transform: scale(1.03);
}

.solo-hint-button img {

    width: 100%;
    height: 100%;

    object-fit: cover;

    display: block;
}


/* =====================================================
   CHOIX SOLO
===================================================== */

#soloChoices {

    max-width: 1000px;

    grid-template-columns:
        repeat(4, 1fr);

    gap: 18px;

    margin-top: 30px;
}


/* =====================================================
   AUDIO
===================================================== */

#audioPlayer {
    display: none;
}


/* =====================================================
   RESULTAT
===================================================== */

.result-overlay {

    position: fixed;

    inset: 0;

    z-index: 99999;

    display: flex;

    align-items: center;

    justify-content: center;

    background:
        rgba(0, 0, 0, .35);

    pointer-events: none;

    animation:
        resultAppear .35s ease;
}

.result-overlay img {

    width:
        min(80vw, 700px);

    max-width:
        90vw;

    max-height:
        80vh;

    object-fit:
        contain;

    display:
        block;

    filter:
        drop-shadow(
            0 10px 25px
            rgba(0,0,0,.35)
        );
}

@keyframes resultAppear {

    from {

        opacity: 0;

        transform:
            scale(.5);
    }

    to {

        opacity: 1;

        transform:
            scale(1);
    }
}


/* =====================================================
   TABLETTE
===================================================== */

@media (max-width: 800px) {

    #home {
        padding-top: 35px;
    }

    .home-menu {

        grid-template-columns:
            minmax(280px, 500px);

        gap: 22px;

        /*
           Accueil encore plus bas
        */

        margin-top: 90px;
    }

    .home-button {
        aspect-ratio: 16 / 9;
    }

    .home-bubble {

        width: 58px;
        height: 58px;

        font-size: 30px;

        right: 10px;
        bottom: 10px;
    }

    .modes {

        grid-template-columns:
            1fr;

        max-width: 500px;

        gap: 18px;
    }

    .mode-button {
        aspect-ratio: 16 / 9;
    }

    .gallery {

        grid-template-columns:
            repeat(3, 1fr);
    }

    #soloChoices {

        grid-template-columns:
            repeat(3, 1fr);
    }

    #choices.disney-gallery,
    #soloChoices.disney-gallery {

        grid-template-columns:
            repeat(3, 1fr);
    }

    .hint-card {

        width: 120px;
        height: 120px;
    }

    .hint-image {

        width: 95px;
        height: 95px;
    }
}


/* =====================================================
   PETIT TELEPHONE
===================================================== */

@media (max-width: 600px) {

    .mode-bubble,
    .guess-mode-bubble,
    .solo-mode-bubble {

        width: 110px;
        height: 110px;

        top: 10px;
        right: 10px;
    }

    .show-photo-box,
    .guess-photo-box {

        width: 95vw;

        height: 55vh;

        min-height: 300px;
    }

    .show-photo-box.animals,
    .guess-photo-box.animals {

        width: 95vw;

        height: 55vh;
    }

    .show-photo-box.disney,
    .guess-photo-box.disney {

        width: min(550px, 80vw);

        height: min(700px, 75vh);

        max-height: 75vh;
    }

    .show-navigation,
    .guess-navigation,
    .solo-navigation {

        gap: 10px;
    }

    .show-navigation .action-button,
    .guess-navigation .action-button,
    .solo-navigation .action-button {

        min-width: 0;

        padding:
            15px 12px;

        font-size: 20px;
    }

    .guess-tool-button {

        width: 44vw;

        max-width: 220px;
    }

    .hint-icons {
        gap: 5px;
    }

    .hint-card {

        width: auto;
        height: auto;

        aspect-ratio: 1 / 1;
    }

    .hint-image {

        width: 85%;
        height: 85%;
    }

    #choices.disney-gallery,
    #soloChoices.disney-gallery {

        grid-template-columns:
            repeat(2, 1fr);

        gap: 12px;

        max-width: 400px;
    }

    #choices.disney-gallery button,
    #soloChoices.disney-gallery button {

        aspect-ratio: 3 / 4;

        padding: 4px;

        border-radius: 18px;
    }

    #choices.disney-gallery img,
    #soloChoices.disney-gallery img {

        border-radius: 13px;
    }

    #soloChoices {

        grid-template-columns:
            repeat(3, 1fr);

        gap: 10px;
    }

    #soloChoices button {

        padding: 3px;

        border-radius: 15px;
    }

    #soloChoices img {
        border-radius: 10px;
    }

    .result-overlay img {

        width: 88vw;

        max-width: 650px;

        max-height: 75vh;
    }
}


/* =====================================================
   TRES PETIT TELEPHONE
===================================================== */

@media (max-width: 450px) {

    #home {
        padding-top: 25px;
    }

    .home-title {
        margin-bottom: 30px;
    }

    .home-menu {

        grid-template-columns:
            minmax(250px, 390px);

        gap: 18px;

        margin-top: 75px;
    }

    .home-bubble {

        width: 52px;
        height: 52px;

        font-size: 27px;
    }

    .gallery {

        grid-template-columns:
            repeat(2, 1fr);
    }

    #soloChoices {

        grid-template-columns:
            repeat(2, 1fr);

        gap: 10px;
    }

    .hint-card {

        width: 100px;
        height: 100px;
    }

    .hint-image {

        width: 75px;
        height: 75px;
    }
}

/* =====================================================
   COMMANDES DE JEU FIXES
===================================================== */

.game-fixed-back {

    position: fixed;

    top: 12px;
    left: 12px;

    z-index: 10000;

    width: 65px;
    height: 65px;

    padding: 0;

    margin: 0;

    border: none;

    border-radius: 20px;

    background: #eeeeee;

    font-size: 32px;

    box-shadow:
        0 5px 15px rgba(0,0,0,.20);
}


.game-fixed-controls {

    position: fixed;

    right: calc((100vw - min(1100px, 100vw)) / 2 + 20px);

    top: 50%;

    transform: translateY(-50%);

    z-index: 10000;

    display: flex;

    flex-direction: column;

    align-items: center;

    gap: 12px;
}


.fixed-next-button,
.fixed-pass-button {

    border: none;

    border-radius: 20px;

    min-width: 135px;

    min-height: 58px;

    padding: 10px 16px;

    color: white;

    font-size: 20px;

    font-weight: bold;

    box-shadow:
        0 5px 15px rgba(0,0,0,.25);
}


.fixed-next-button {

    background: #35b957;
}


.fixed-pass-button {

    background: #f28c28;
}


.score-display,
.timer-display,
.timer-start-button {

    position: fixed;

    z-index: 10000;

    padding: 10px 14px;

    border-radius: 18px;

    font-size: 20px;

    font-weight: bold;

    box-shadow:
        0 5px 15px rgba(0,0,0,.20);
}


/* SCORE */

.score-display {

    right: 20px;

    bottom: 145px;

    background: white;
}


/* CHRONOMETRE */

.timer-display {

    right: 20px;

    bottom: 85px;

    background: white;
}


/* BOUTON DEMARRER */

.timer-start-button {

    right: 125px;

    bottom: 85px;

    padding: 10px 12px;

    border: none;

    cursor: pointer;

    background: #35b957;

    color: white;

    font-weight: bold;

    transition:
        transform .2s ease,
        opacity .2s ease;
}


.timer-start-button:hover {

    transform: scale(1.05);
}


.timer-start-button:active {

    transform: scale(.96);
}


.timer-start-button:disabled {

    opacity: .55;

    cursor: default;

    transform: none;
}

.timer-start-button:hover {

    transform: scale(1.05);
}


.timer-start-button:active {

    transform: scale(.96);
}


.timer-start-button:disabled {

    opacity: .55;

    cursor: default;

    transform: none;
}

/* =====================================================
   GRAND SCORE FINAL
===================================================== */

#finalScoreOverlay {

    position: fixed;

    inset: 0;

    z-index: 200000;

    display: flex;

    align-items: center;

    justify-content: center;

    background:
        rgba(0,0,0,.55);
}


.final-score-box {

    width: min(90vw, 650px);

    padding: 45px 30px;

    border-radius: 40px;

    background: white;

    box-shadow:
        0 10px 40px rgba(0,0,0,.35);

    text-align: center;
}


.final-score-title {

    font-size:
        clamp(45px, 10vw, 80px);

    font-weight: bold;

    margin-bottom: 15px;
}


.final-score-number {

    font-size:
        clamp(100px, 25vw, 190px);

    line-height: 1;

    font-weight: bold;

    color: #35b957;
}


.final-score-text {

    font-size:
        clamp(30px, 7vw, 55px);

    font-weight: bold;

    margin-bottom: 30px;
}


.final-score-button {

    border: none;

    border-radius: 25px;

    padding: 18px 35px;

    background: #35b957;

    color: white;

    font-size: 25px;

    font-weight: bold;
}


/* =====================================================
   INDICES PLUS PETITS
===================================================== */

.hint-box {

    max-width: 450px;

    margin: 15px auto;

    padding:
        12px 10px 15px;
}


.hint-title {

    font-size: 28px;

    margin-bottom: 8px;
}


.hint-icons {

    gap: 6px;
}


.hint-card {

    width: 75px;
    height: 75px;

    max-width: 75px;

    border-radius: 16px;
}


.hint-image {

    width: 60px;
    height: 60px;
}


/* =====================================================
   SOLO : MUSIQUE + INDICE COTE A COTE
===================================================== */

.solo-audio-area {

function randomItem(array) {

    return array[
        Math.floor(
            Math.random() * array.length
        )
    ];
}


/* Mélange réellement un tableau */
function shuffleArray(array) {

    const result = [...array];

    for (
        let i = result.length - 1;
        i > 0;
        i--
    ) {

        const j =
            Math.floor(
                Math.random() * (i + 1)
            );

        [
            result[i],
            result[j]
        ] =
        [
            result[j],
            result[i]
        ];
    }

    return result;
}


/* Crée un ordre aléatoire */
function createRandomOrder(data) {

    return shuffleArray(data);
}

function resetScore() {

    updateScoreDisplay();
}

    currentScore++;

}


function updateScoreDisplay() {

    document
        .querySelectorAll(".score-display")
        .forEach(function(element) {

            element.textContent =
                "⭐ " + currentScore;

        });
}


/* =====================================================
   CHRONOMETRE
===================================================== */

function resetTimer() {

    clearInterval(timerInterval);

    timerInterval = null;

    timeLeft = 60;

    timerStarted = false;

    updateTimerDisplay();

    updateTimerButton();

}


function startTimer() {

    if (timerStarted) return;

    timerStarted = true;

    updateTimerButton();

    timerInterval =
        setInterval(function() {

            timeLeft--;

            updateTimerDisplay();

            if (timeLeft <= 0) {

                clearInterval(timerInterval);

                timerInterval = null;

                showFinalScore();

            }

        }, 1000);
}


function updateTimerDisplay() {

    const minutes =
        Math.floor(timeLeft / 60);

    const seconds =
        timeLeft % 60;

    const text =
        minutes +
        ":" +
        String(seconds).padStart(2, "0");


    document
        .querySelectorAll(".timer-display")
        .forEach(function(element) {

            element.textContent =
                "⏱️ " + text;

        });
}

function updateTimerButton() {

    document
        .querySelectorAll(".timer-start-button")
        .forEach(function(button) {

            button.disabled = timerStarted;

            if (timerStarted) {

                button.textContent =
                    "▶️ En cours";

            }

            else {

                button.textContent =
                    "▶️ Démarrer";

            }

        });
}

    const existing =

            '<button class="final-score-button" onclick="closeFinalScore()">' +
                '▶️ Continuer' +
            '</button>' +

        '</div>';


    document.body.appendChild(overlay);
}

        showPosition = 0;

function previousShowItem() {

    const data = getCurrentData();

    if (!data.length) return;


    if (secretItem === null) {

        secretItem =
            data[data.length - 1];

    }

    else {

        const currentIndex =
            data.findIndex(function(item) {

                return item.id === secretItem.id;

            });


        const previousIndex =
            (currentIndex - 1 + data.length) %
            data.length;


        secretItem =
            data[previousIndex];
    }


    document
        .getElementById("showImage")
        .src =
            secretItem.image;
}

        .getElementById("aliciaScreen")
        .classList.add("hidden");


    clearGuessContent();

    updateChoicesButton();
}


function clearGuessContent() {

    document
        .getElementById("hintArea")
        .innerHTML = "";

    document
        .getElementById("choices")
        .innerHTML = "";

    document
        .getElementById("guessResult")
        .innerHTML = "";

    document
        .getElementById("choices")
        .classList.remove("disney-gallery");
}


function hideSecret() {

    const secretImage =
        document.getElementById("secretImage");


    secretImage.src = "";

    secretImage.classList.add("hidden");


    document
        .getElementById("parentScreen")
        .classList.add("hidden");


    document
        .getElementById("aliciaScreen")
        .classList.remove("hidden");


    clearGuessContent();

    updateChoicesButton();
}


/* =====================================================
   NAVIGATION DEVINE
===================================================== */

function nextGuessItem() {

    if (!guessOrder.length) return;

    guessPosition++;

    if (
        guessPosition >=
        guessOrder.length
    ) {

        guessOrder =
            createRandomOrder(
                getCurrentData()
            );

        guessPosition = 0;
    }


    secretItem =
        guessOrder[guessPosition];


    resetGuessForNewItem();
}

function previousGuessItem() {

    const data = getCurrentData();

    if (!data.length) return;


    const currentIndex =
        data.findIndex(function(item) {

            return item.id === secretItem.id;

        });


    secretItem =
        data[
            (currentIndex - 1 + data.length) %
            data.length
        ];


    resetGuessForNewItem();
}


function resetGuessForNewItem() {

    const photoBox =
        document.querySelector(".guess-photo-box");


    photoBox.classList.remove(
        "animals",
        "disney"
    );

    photoBox.classList.add(
        currentCategory
    );


    const secretImage =
        document.getElementById("secretImage");


    secretImage.src =
        secretItem.image;

    secretImage.classList.remove("hidden");


    document
        .getElementById("parentScreen")
        .classList.remove("hidden");


    document
        .getElementById("aliciaScreen")
        .classList.add("hidden");


    clearGuessContent();

    updateChoicesButton();
}


/* =====================================================
   BOUTON PLUSIEURS POSSIBILITES
===================================================== */

function updateChoicesButton() {

    const buttonImage =
        document.getElementById(
            "choicesButtonImage"
        );


    if (!buttonImage) return;


    if (currentCategory === "animals") {

        buttonImage.src =
            "images/indices/plusieurs_animaux.jpg";

    }

    else {

        buttonImage.src =
            "images/indices/plusieurs_disney.jpg";

    }
}


/* =====================================================
   INDICES PARENTS
===================================================== */

function showHint() {

    const area =
        document.getElementById("hintArea");


    if (!secretItem) return;


    let hints;


    if (currentCategory === "animals") {

        hints =
            animalHints[secretItem.id];

    }

    else {

        hints =
            disneyHints[secretItem.id];

    }


    if (!hints) return;


    createHintBox(
        area,
        hints
    );
}


/* =====================================================
   CREATION DES INDICES
===================================================== */

function createHintBox(area, hints) {

    area.innerHTML = "";


    const box =
        document.createElement("div");

    box.className =
        "hint-box";


    const title =
        document.createElement("div");

    title.className =
        "hint-title";

    title.textContent =
        "💡💡💡";


    const icons =
        document.createElement("div");

    icons.className =
        "hint-icons";


    hints.forEach(function(fileName) {

        const card =
            document.createElement("div");

        card.className =
            "hint-card";


        const img =
            document.createElement("img");

        img.src =
            "images/indices/" +
            fileName;

        img.alt = "";

        img.className =
            "hint-image";


        card.appendChild(img);

        icons.appendChild(card);

    });


    box.appendChild(title);

    box.appendChild(icons);

    area.appendChild(box);
}


/* =====================================================
   PLUSIEURS POSSIBILITES - PARENTS
===================================================== */

function showChoices() {

    if (!secretItem) return;


    const data =
        getCurrentData();


    const choices =
        document.getElementById("choices");


    const result =
        document.getElementById("guessResult");


    result.innerHTML = "";

    choices.innerHTML = "";


    choices.classList.remove(
        "disney-gallery"
    );


    if (currentCategory === "disney") {

        choices.classList.add(
            "disney-gallery"
        );
    }


    const others =
        data.filter(function(item) {

            return item.id !== secretItem.id;

        });


    const shuffledOthers =
        [...others].sort(function() {

            return Math.random() - 0.5;

        });


    const selected = [

        secretItem,

        ...shuffledOthers.slice(0, 11)

    ];


    selected.sort(function() {

        return Math.random() - 0.5;

    });


    selected.forEach(function(item) {

        const button =
            document.createElement("button");


        const image =
            document.createElement("img");


        image.src =
            item.image;

        image.alt = "";


        button.appendChild(image);


        button.onclick =
            function() {

                showGuessResult(
                    result,
                    item.id === secretItem.id
                );

            };


        choices.appendChild(button);

    });
}


/* =====================================================
   RESULTAT PARENTS
===================================================== */

function showGuessResult(result, correct) {

    result.innerHTML =

        '<div class="result-overlay">' +

        '<img src="' +

        (
            correct
            ? "images/indices/bravo.png"
            : "images/indices/perdu.png"
        ) +

        '">' +

        '</div>';


    const overlay =
        result.querySelector(
            ".result-overlay"
        );


    overlay.style.pointerEvents =
        "auto";

    overlay.style.cursor =
        "pointer";


    overlay.onclick =
        function() {

            result.innerHTML = "";

        };
}


/* =====================================================
   SOLO
===================================================== */

function startSoloGame() {

    hideAll();

    document
        .getElementById("soloGame")
        .classList.remove("hidden");


   soloIndex = 0;

soloOrder =
    createRandomOrder(
        getCurrentData()
    );

soloPosition = 0;

resetScore();
resetTimer();

newSoloGame();

}


/* =====================================================
   NOUVELLE PARTIE SOLO
===================================================== */

function newSoloGame() {

    const data =
        getCurrentData();


    if (!data.length) return;


   if (!soloOrder.length) {

    soloOrder =
        createRandomOrder(data);

    soloPosition = 0;
}


secretItem =
    soloOrder[soloPosition];


    document
        .getElementById("soloHintArea")
        .innerHTML = "";


    document
        .getElementById("soloResult")
        .innerHTML = "";


    createSoloChoices();

    prepareSoloAudio();
showSoloHint();
}


/* =====================================================
   AUDIO SOLO
===================================================== */

function prepareSoloAudio() {

    const player =
        document.getElementById(
            "audioPlayer"
        );


    if (
        secretItem &&
        secretItem.audio
    ) {

        player.src =
            secretItem.audio;

    }

    else {

        player.removeAttribute(
            "src"
        );

    }
}


function playSoloAudio() {

    const player =
        document.getElementById(
            "audioPlayer"
        );


    if (
        secretItem &&
        secretItem.audio
    ) {

        player.play().catch(
            function() {}
        );

        return;
    }


    const button =
        document.querySelector(
            ".solo-audio-button"
        );


    button.textContent =
        "🎵";


    setTimeout(function() {

        button.textContent =
            "🔊";

    }, 700);
}


/* =====================================================
   INDICE SOLO
===================================================== */

function showSoloHint() {

    if (!secretItem) return;


    let hints;


    if (currentCategory === "animals") {

        hints =
            animalHints[secretItem.id];

    }

    else {

        hints =
            disneyHints[secretItem.id];

    }


    if (!hints) return;


    const area =
        document.getElementById(
            "soloHintArea"
        );


    createHintBox(
        area,
        hints
    );
}


/* =====================================================
   PROPOSITIONS SOLO
===================================================== */
function createSoloChoices() {

    const area =
        document.getElementById(
            "soloChoices"
        );

    area.innerHTML = "";

    area.classList.remove(
        "disney-gallery"
    );

    if (currentCategory === "disney") {

        area.classList.add(
            "disney-gallery"
        );

    }

    const data =
        getCurrentData();

    const others =
        data.filter(function(item) {

            return item.id !== secretItem.id;

        });

    const shuffled =
        [...others].sort(function() {

            return Math.random() - 0.5;

        });

    const selected = [

        secretItem,

        ...shuffled.slice(0, 11)

    ];

    selected.sort(function() {

        return Math.random() - 0.5;

    });

    selected.forEach(function(item) {

        const button =
            document.createElement(
                "button"
            );

        const image =
            document.createElement(
                "img"
            );

        image.src =
            item.image;

        image.alt = "";

        button.appendChild(
            image
        );

        button.onclick =
            function() {

                if (
                    item.id ===
                    secretItem.id
                ) {

                    /* =================================
                       BONNE REPONSE
                    ================================= */

                    addPoint();

                    showSoloResult(true);

                }

                else {

                    /* =================================
                       MAUVAISE REPONSE
                    ================================= */

                    showSoloResult(false);

                }

            };

        area.appendChild(
            button
        );

    });

}


/* =====================================================
   RESULTAT SOLO
===================================================== */
function showSoloResult(correct) {

    const result =
        document.getElementById(
            "soloResult"
        );

    result.innerHTML =

        '<div class="result-overlay">' +

        '<img src="' +

        (
            correct
            ? "images/indices/bravo.png"
            : "images/indices/perdu.png"
        ) +

        '">' +

        '</div>';


    const overlay =
        result.querySelector(
            ".result-overlay"
        );


    overlay.style.pointerEvents =
        "auto";

    overlay.style.cursor =
        "pointer";


    overlay.onclick =
        function() {

            result.innerHTML = "";

            /* =============================
               SI BONNE REPONSE :
               passer à l'image suivante
            ============================= */

            if (correct) {

                nextSoloItem();

            }

        };

}

/* =====================================================
   SUIVANT SOLO
===================================================== */

function nextSoloItem() {

    if (!soloOrder.length) return;

    soloPosition++;

    if (
        soloPosition >=
        soloOrder.length
    ) {

        soloOrder =
            createRandomOrder(
                getCurrentData()
            );

        soloPosition = 0;
    }


    secretItem =
        soloOrder[soloPosition];


    resetSoloForNewItem();
}

/* =====================================================
   PRECEDENT SOLO
===================================================== */

function previousSoloItem() {

    const data =
        getCurrentData();


    if (!data.length) return;


    const currentIndex =
        data.findIndex(function(item) {

            return item.id === secretItem.id;

        });


    const previousIndex =
        (
            currentIndex -
            1 +
            data.length
        ) % data.length;


    secretItem =
        data[previousIndex];


    resetSoloForNewItem();
}


/* =====================================================
   RESET SOLO
===================================================== */

function resetSoloForNewItem() {

    document
        .getElementById("soloHintArea")
        .innerHTML = "";


    document
        .getElementById("soloResult")
        .innerHTML = "";


    createSoloChoices();

    prepareSoloAudio();
showSoloHint();
}

===================================================== */

/*
   Le navigateur installe le service worker.
   Celui-ci permettra ensuite de charger le jeu
   même lorsque la tablette n'a plus Internet.
*/

if ("serviceWorker" in navigator) {

    window.addEventListener(
        "load",
        function() {

            navigator.serviceWorker
                .register("./service-worker.js")
                .then(function() {

                    console.log(
                        "Jeu d'Alicia : mode hors connexion activé."
                    );

                })
                .catch(function(error) {

                    console.log(
                        "Service worker non disponible :",
                        error
                    );

                });

        }
    );

}
